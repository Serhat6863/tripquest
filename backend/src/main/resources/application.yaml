spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tripquest
    username: tripquest_user
    password: tripquest_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  # Clé base64 encodée, minimum 256 bits — À CHANGER en production
  secret: dGhpcy1pcy1teS12ZXJ5LXNlY3VyZS1zZWNyZXQta2V5LWZvci10cmlwcXVlc3Q=
  expiration: 86400000 # 24h en millisecondes