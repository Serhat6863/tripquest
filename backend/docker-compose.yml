services:
  postgres:
    image: postgres:16
    container_name: tripquest-db
    environment:
      POSTGRES_DB: tripquest
      POSTGRES_USER: tripquest_user
      POSTGRES_PASSWORD: tripquest_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: